name: crates.io publish

# Any GitHub Release publishes the crates whose version is not on crates.io
# yet, once the run is approved in the `crates-io` environment. See RELEASE.md.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: crates-publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.plan.outputs.crates }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      # Fails when the packages don't share one major.minor.
      - id: plan
        run: |
          bun scripts/release.ts
          crates=$(bun scripts/release.ts crates)
          echo "crates=$crates" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.crates != ''
    runs-on: ubuntu-latest
    env:
      CRATES: ${{ needs.plan.outputs.crates }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test --workspace

      - name: Dry run
        run: |
          args=()
          for crate in $CRATES; do args+=(-p "$crate"); done
          cargo publish --dry-run "${args[@]}"

  publish:
    needs: [plan, test]
    runs-on: ubuntu-latest
    # Required reviewers on this environment make the run wait for approval.
    environment: crates-io
    permissions:
      contents: read
      id-token: write # trusted publishing
    env:
      CRATES: ${{ needs.plan.outputs.crates }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Cargo publishes them in dependency order.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          args=()
          for crate in $CRATES; do args+=(-p "$crate"); done
          cargo publish "${args[@]}"

name: npm publish

# Any GitHub Release stages the npm packages whose version is not on npm yet.
# Nothing is public until each staged version is approved on npmjs.com.
# See RELEASE.md.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      # Fails when the packages don't share one major.minor.
      - id: plan
        run: |
          bun scripts/release.ts
          packages=$(bun scripts/release.ts npm)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  stage:
    needs: plan
    if: needs.plan.outputs.packages != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    env:
      PACKAGES: ${{ needs.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Pinned to the wasm-bindgen version in crates/zamn_wasm/Cargo.toml.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      # `npm stage` and trust relationships with stage permission.
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run test

      # Bun turns `workspace:~` into `~<version>`; npm would publish it as it is.
      - name: Stage
        env:
          # Only for the first release, before the packages exist; see RELEASE.md.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          for dir in $PACKAGES; do
            out="$RUNNER_TEMP/npm/$dir"
            (cd "$dir" && bun pm pack --destination "$out")
            tag=latest
            case "$(jq -r .version "$dir/package.json")" in *-*) tag=next ;; esac
            npm stage publish "$out"/*.tgz --provenance --tag "$tag"
          done

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/zeokku/zamn"
homepage = "https://zeokku.github.io/zamn/reference/rust"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
insta = "1"
zamn_lexer = { path = "crates/zamn_lexer", version = "~1.0.0" }
zamn_parser = { path = "crates/zamn_parser", version = "~1.0.0" }
zamn_codegen = { path = "crates/zamn_codegen", version = "~1.0.0" }
zamn = { path = "crates/zamn", version = "~1.0.0" }

[profile.release]
opt-level = "s"
lto = true
